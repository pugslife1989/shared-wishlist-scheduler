services:
    wishlist-jenkins:

      container_name: wl-jenkins

      image: jenkins/jenkins:lts

      group_add:
        - 107
      
      restart: unless-stopped

      ports:
        - 8082:8080

      volumes:
        - jenkins_home:/var/jenkins_home
        - /var/run/docker.sock:/var/run/docker.sock
        - /usr/bin/docker:/usr/bin/docker  
        - /home/ryan/wishlist-scheduler:/wishlist-scheduler

volumes:
    jenkins_home:
