<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Wishlist & Date Scheduler</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; max-width: 540px; margin: 24px auto; padding: 0 16px; }
        h2 { color: #38bdf8; margin-bottom: 4px; }
        .sub { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        input, select, button { width: 100%; padding: 11px; margin: 6px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; box-sizing: border-box; font-size: 14px; }
        button { background: #0284c7; border: none; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0369a1; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .Dating { background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); }
        .Family { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .done-badge { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); margin-left: 6px; }
        .title { font-size: 17px; font-weight: 600; margin: 10px 0 4px; }
        a { color: #38bdf8; text-decoration: none; font-size: 13px; word-break: break-all; }
        .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .btn-sm { padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; background: #334155; color: #f8fafc; border: none; cursor: pointer; width: auto; margin: 0; }
        .btn-went { background: #059669; }
        .btn-del { background: #991b1b; }
        img.memory { width: 100%; border-radius: 8px; margin-top: 12px; border: 1px solid #475569; }
    </style>
</head>
<body>
    <h2>Shared Wishlist</h2>
    <div class="sub">Save spots, pick a date &amp; log memories</div>

    <div class="card">
        <form method="POST" action="/add">
            <input type="text" name="title" placeholder="Place or activity name (e.g. Tampines Night Market)" required>
            <input type="url" name="url" placeholder="Paste link (TikTok, IG, Google Maps...)" required>
            <select name="category">
                <option value="Dating">Dating</option>
                <option value="Family">Family</option>
            </select>
            <input type="date" name="visit_date" required>
            <button type="submit">+ Add to Wishlist</button>
        </form>
    </div>

    {% for p in places %}
    <div class="card">
        <div>
            <span class="badge {{ p.category }}">{{ p.category }}</span>
            <span style="font-size: 13px; color: #94a3b8; margin-left: 8px;">📅 {{ p.visit_date }}</span>
            {% if p.visited %}<span class="badge done-badge">✓ We went!</span>{% endif %}
        </div>
        <div class="title">{{ p.title }}</div>
        <a href="{{ p.url }}" target="_blank">{{ p.url }}</a>

        {% if p.photo %}
            <img class="memory" src="/photos/{{ p.photo }}" alt="Outing memory">
        {% endif %}

        <div class="actions">
            <a class="btn-sm" href="/calendar/{{ p.id }}">⏰ Add Calendar Reminder</a>
            <form method="POST" action="/delete/{{ p.id }}" style="margin:0;">
                <button class="btn-sm btn-del" type="submit">Delete</button>
            </form>
        </div>

        {% if not p.visited %}
        <form method="POST" action="/went/{{ p.id }}" enctype="multipart/form-data" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 10px;">
            <input type="file" name="photo" accept="image/*" style="padding: 6px; font-size: 12px;">
            <button class="btn-sm btn-went" type="submit" style="width: 100%; margin-top: 6px;">✓ We went! (Save Photo)</button>
        </form>
        {% endif %}
    </div>
    {% endfor %}
</body>
</html>
