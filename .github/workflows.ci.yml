name: CI - Test & Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & check syntax
        run: |
          pip install -r requirements.txt
          python -m py_compile app.py

      - name: Test Docker image build
        run: docker build -t shared-wishlist-scheduler:test .

      - name: Smoke test
        run: |
          docker run -d --name wishlist-test -e SECRET_KEY=test-secret-for-ci -p 5000:5000 shared-wishlist-scheduler:test
          sleep 10
          curl -f http://localhost:5000/healthz
          docker stop wishlist-test
