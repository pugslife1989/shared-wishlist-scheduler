services:
  wishlist-app:
    build: .          
    container_name: shared-wishlist-scheduler   
    restart: unless-stopped                
    ports:
      - 5000:5000      
    volumes:
      - wishlist_data:/data                 
    env_file:
      - .env
    environment:
      - DB_PATH=/data/places.db
      - PHOTOS_DIR=/data/photos
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env — see .env.example}
volumes:
  wishlist_data:
