services:
  wishlist-app:
    build: .          # Hint: current directory is a single dot
    container_name: shared-wishlist-scheduler   # Hint: e.g., shared-wishlist-scheduler
    restart: unless-stopped                # Hint: auto-restart unless manually stopped
    ports:
      - 5000:5000      # Hint: both match your Flask/Gunicorn port
    volumes:
      - wishlist_data:/data                 # Hint: name your persistent volume (e.g., wishlist_data)
    environment:
      - DB_PATH=/data.places.db       # Hint: must sit inside /data (e.g., /data/places.db)
      - PHOTOS_DIR=/data/photos  # Hint: must sit inside /data (e.g., /data/photos)
      - PORT=5000                     # Hint: 5000

volumes:
  wishlist_data:                  # Hint: must match the exact volume name used above
